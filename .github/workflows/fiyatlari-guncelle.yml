name: Fiyatları güncelle

on:
  schedule:
    # Saatler UTC'dir. Türkiye saati = UTC + 3.
    - cron: "35 7 * * 1-5"   # 10:35 açılıştan sonra
    - cron: "35 10 * * 1-5"  # 13:35 öğlen
    - cron: "20 15 * * 1-5"  # 18:20 kapanıştan sonra
  workflow_dispatch: {}      # "Run workflow" butonuyla elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: fiyat
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fiyatları çek
        run: python scripts/fiyat_cek.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "fiyat-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fiyatlar.json
          git diff --cached --quiet || git commit -m "Fiyatlar güncellendi"
          git push
