name: Fiyatları güncelle

on:
  schedule:
    # Saatler UTC'dir. Türkiye saati = UTC + 3.
    # Borsa açıkken 15 dakikada bir (hafta içi 10:00–18:15).
    # Yahoo verisi zaten ~15 dk gecikmeli olduğu için daha sık çekmenin faydası yok.
    - cron: "*/15 7-14 * * 1-5"  # 10:00, 10:15 ... 17:45
    - cron: "0,15 15 * * 1-5"    # 18:00 ve kapanış sonrası 18:15
  workflow_dispatch: {}      # "Run workflow" butonuyla elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: fiyat
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fiyatları çek
        run: python scripts/fiyat_cek.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "fiyat-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fiyatlar.json
          git diff --cached --quiet && exit 0
          git commit -m "Fiyatlar güncellendi"
          git pull --rebase -q
          git push
